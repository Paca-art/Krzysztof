<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Krzysztof Paczkowski - Graphic Designer Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandNavy: '#0A192F',
                        brandBlue: '#0052FF',
                        brandDark: '#020C1B',
                        card: '#112240',
                        light: '#F4F7FA',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    },
                    height: {
                        'screen-dvh': '100dvh',
                    },
                    minHeight: {
                        'screen-dvh': '100dvh',
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
            background-color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        .snap-container {
            height: 100dvh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        @media (min-width: 1024px) {
            .snap-container {
                scroll-snap-type: y mandatory;
                scrollbar-width: none;
            }
            .snap-container::-webkit-scrollbar { display: none; }
        }
        .snap-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-height: 100dvh;
            padding: 100px 0 60px 0;
        }
        @media (min-width: 1024px) {
            .snap-section {
                scroll-snap-align: start;
                padding: 0;
            }
        }
        .snap-footer {
            min-height: auto !important;
        }
        @media (min-width: 1024px) {
            .snap-footer { scroll-snap-align: end; }
        }
        .rigid-container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .anim-left { transform: translateX(-50px); opacity: 0; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .anim-right { transform: translateX(50px); opacity: 0; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .anim-bottom { transform: translateY(50px); opacity: 0; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        @media (min-width: 768px) {
            .anim-left { transform: translateX(-150px); }
            .anim-right { transform: translateX(150px); }
            .anim-bottom { transform: translateY(100px); }
        }
        .is-visible .anim-left,
        .is-visible .anim-right,
        .is-visible .anim-bottom {
            transform: translate(0, 0);
            opacity: 1;
        }
        .delay-1 { transition-delay: 150ms; }
        .delay-2 { transition-delay: 300ms; }
        .delay-3 { transition-delay: 450ms; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { scrollbar-width: none; }
        @media (min-width: 1024px) {
            .timeline-scroll::-webkit-scrollbar { width: 6px; }
            .timeline-scroll::-webkit-scrollbar-track { background: #F4F7FA; border-radius: 10px; }
            .timeline-scroll::-webkit-scrollbar-thumb { background: #0052FF; border-radius: 10px; }
        }
        @keyframes subtle-tremble {
            0% { border-radius: 50%; transform: scale(1); }
            25% { border-radius: 49% 51% 48% 52% / 51% 49% 52% 48%; transform: scale(0.99); }
            50% { border-radius: 51% 49% 52% 48% / 48% 52% 49% 51%; transform: scale(1.01); }
            75% { border-radius: 48% 52% 51% 49% / 52% 48% 50% 50%; transform: scale(0.995); }
            100% { border-radius: 50%; transform: scale(1); }
        }
        .animate-jelly { animation: subtle-tremble 5s infinite ease-in-out; }
        .easter-egg-container {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translate(-100%, -50%);
            z-index: 100;
            pointer-events: none;
            will-change: transform;
        }
        .easter-egg-image {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #0052FF;
            box-shadow: 0 10px 25px -5px rgba(0, 82, 255, 0.4);
            object-fit: cover;
            clip-path: polygon(50% 0%, 100% 0%, 100% 100%, 50% 100%);
            transform: translateX(-50%);
        }
        @media (min-width: 768px) {
            .easter-egg-image {
                width: 150px;
                height: 150px;
                border: 4px solid #0052FF;
            }
        }
        .pacman-dots {
            background-image: radial-gradient(circle, #0052FF 3px, transparent 4px);
            background-size: 24px 24px;
            background-repeat: repeat-x;
            background-position: left center;
            height: 100%;
            width: 100%;
        }
        .pacman-mask { width: 0%; }
        .pacman-mover {
            left: 0%;
            opacity: 0;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .is-visible .pacman-mask {
            animation: eat-dots-mask 5s linear forwards;
            animation-delay: 3s;
        }
        .is-visible .pacman-mover {
            animation: eat-dots-mover 5s linear forwards;
            animation-delay: 3s;
        }
        .is-visible .pacman-body {
            animation: chomp 0.4s infinite linear;
            animation-delay: 3s;
        }
        @keyframes eat-dots-mask {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        @keyframes eat-dots-mover {
            0% { left: 0%; opacity: 0; }
            1% { opacity: 1; }
            99% { left: 100%; opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }
        @keyframes chomp {
            0%, 100% { d: path('M 0,0 L 50,-0.1 A 50,50 0 1,0 50,0.1 Z'); }
            50% { d: path('M 0,0 L 35.35,-35.35 A 50,50 0 1,0 35.35,35.35 Z'); }
        }
        #mobile-menu {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #mobile-menu.menu-open {
            opacity: 1;
            visibility: visible;
        }
        body.menu-open { overflow: hidden; }

        /* ===== KAFELEK WWW - STYLE PODSTAWOWE ===== */
        .www-card { position: relative; overflow: hidden; }
        .www-card .card-img-wrap img { transition: transform 0.7s ease, filter 0.5s ease; }
        .www-card:hover .card-img-wrap img { transform: scale(1.08); filter: brightness(0.45); }

        /* ===== TŁO SEKCJI DLA PROJEKTÓW WWW ===== */
        .www-section-bg {
            position: absolute; inset: 0; z-index: 0; pointer-events: none;
            display: flex; align-items: flex-end; justify-content: center;
            padding: 0 1rem; overflow: hidden;
        }
        @media (min-width: 1024px) { .www-section-bg { padding: 0 3rem; } }
        .www-section-tray {
            width: 100%; max-width: 1280px; height: 100%; display: flex; align-items: flex-end; gap: 1rem; padding-bottom: 2rem;
        }
        .www-section-thumb {
            flex: 1; height: 0%; border-radius: 16px 16px 0 0; overflow: hidden;
            transition: height 0.65s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        }
        .www-section-thumb:nth-child(2) { transition-delay: 0.07s; }
        .www-section-thumb:nth-child(3) { transition-delay: 0.14s; }
        .www-section-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; opacity: 0.6; }
        #portfolio.www-bg-active .www-section-thumb { height: 85%; }

        .branding-card { position: relative; overflow: hidden; }
        .branding-card .branding-img-wrap img { transition: transform 0.7s ease, filter 0.5s ease; }
